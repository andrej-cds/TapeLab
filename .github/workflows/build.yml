name: Build

# - ob vsakem pushu in pull requestu: preveri, da se vse zgradi
# - ob oznaki v*  (npr. v0.6.0): zgradi namestitve in objavi GitHub Release
# - ob pushu na vejo »release«: isto, oznaka v<VERSION> se ustvari sama (verzija iz datoteke VERSION)
# - ročno: Actions -> Build -> Run workflow
on:
  push:
    branches: [main, release]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 10/11 (x64) installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:GITHUB_REF -eq 'refs/heads/release') {
            $v = (Get-Content VERSION).Trim()
          } else {
            $v = ([xml](Get-Content windows/CDSMeasure/CDSMeasure.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Version: $v"

      - name: Publish (self-contained, single file)
        working-directory: windows
        shell: pwsh
        run: >
          dotnet publish CDSMeasure/CDSMeasure.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false -p:Version=$env:VERSION
          -o "Izdaja/CDS TapeLab"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: windows/Namestitev
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" CDSTapeLab.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/Izdaja/CDSTapeLab-Setup-*.exe
          if-no-files-found: error

  windows-xp:
    name: Windows XP (x86, .NET 4.0) package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:GITHUB_REF -eq 'refs/heads/release') {
            $v = (Get-Content VERSION).Trim()
          } else {
            $v = ([xml](Get-Content windows-xp/CDSMeasure/CDSMeasure.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Version: $v"

      - name: Publish
        working-directory: windows-xp
        shell: pwsh
        run: >
          dotnet publish CDSMeasure/CDSMeasure.csproj -c Release
          -p:DebugType=none -p:DebugSymbols=false -p:Version=$env:VERSION
          -o "Izdaja/CDS TapeLab XP"

      - name: Package
        working-directory: windows-xp
        shell: pwsh
        run: |
          Copy-Item Namestitev/README_XP.txt, Namestitev/README_XP_HU.txt "Izdaja/CDS TapeLab XP/"
          Compress-Archive -Path "Izdaja/CDS TapeLab XP/*" -DestinationPath "Izdaja/CDSTapeLab-XP-$env:VERSION.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-xp
          path: windows-xp/Izdaja/CDSTapeLab-XP-*.zip
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.tag }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            tag: apple-silicon
          - rid: osx-x64
            tag: intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' avalonia/CDSTapeLab.csproj | head -1)"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - name: Build .app and .dmg
        working-directory: avalonia
        run: bash packaging/make-app.sh "${{ matrix.rid }}" "$VERSION" "${{ matrix.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.tag }}
          path: avalonia/dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            tag: x64
            os: ubuntu-latest
          - rid: linux-arm64
            tag: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release ]]; then
            V="$(tr -d '[:space:]' < VERSION)"
          else
            V="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' avalonia/CDSTapeLab.csproj | head -1)"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - name: Build tar.gz
        working-directory: avalonia
        run: bash packaging/make-linux.sh "${{ matrix.rid }}" "$VERSION" "${{ matrix.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.tag }}
          path: avalonia/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [windows, windows-xp, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: t
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then T="$GITHUB_REF_NAME"; else T="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "Tag: $T"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
